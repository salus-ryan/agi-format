[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-format"
version = "0.5.0"
description = "A signed, portable boundary-policy format for AI agents, with a reference enforcer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Salus"}]
keywords = ["agents", "ai", "policy", "sandbox", "file-format"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=44,<51",
    "httpx>=0.27,<1",
    "jsonschema[format]>=4.23,<5",
    "structlog>=24.1,<26",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1; platform_system != 'Android'",
    "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/salus-ryan/agi-format"
Repository = "https://github.com/salus-ryan/agi-format"
Issues = "https://github.com/salus-ryan/agi-format/issues"

[project.scripts]
agi = "agi_cli:main"

[tool.setuptools]
py-modules = ["agi_cli"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.setuptools.data-files]
"share/agi-format/schemas" = ["schemas/*.json"]
"share/agi-format/templates/minimal-agent" = ["skeleton/manifest.json", "skeleton/policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
