name: Deploy Modal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'modal>=1.5,<2'
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_app.py
      - name: Smoke test
        env:
          AGI_API_KEY: ${{ secrets.AGI_API_KEY }}
        run: >-
          python scripts/smoke_deployment.py
          --url https://salus--agi-agent-agent.us-east.modal.run
          --api-key "$AGI_API_KEY"
