name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.lock
      - name: Install project
        run: pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Test real OCI tool boundary
        run: |
          docker pull --quiet alpine:3.20
          export AGI_OCI_TEST_IMAGE="$(docker image inspect --format '{{index .RepoDigests 0}}' alpine:3.20)"
          pytest -q tests/test_isolation.py::test_real_oci_boundary_when_ci_image_is_provided
      - name: Validate reference package
        run: agi validate skeleton/ --json --report /tmp/source-conformance.json
      - name: Self-test reusable conformance action
        uses: ./
        with:
          package: skeleton
          report: /tmp/action-conformance.json
      - name: Build distributions
        run: python -m build && python -m twine check dist/*
      - name: Verify wheel installation and bundled template
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          rm -rf /tmp/wheel-test-agent
          /tmp/wheel-test/bin/agi init /tmp/wheel-test-agent --author "CI"
          /tmp/wheel-test/bin/agi validate /tmp/wheel-test-agent --json --report /tmp/wheel-conformance.json
